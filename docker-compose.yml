services:
  app:
    build: .
    ports:
      - "3000:3000"
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/api_monitor
    depends_on:
      - mongo
    env_file:
      - .env

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
volumes:
  mongo_data:
